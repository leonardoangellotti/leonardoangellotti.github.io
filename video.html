<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Featured Video | Leonardo Angellotti</title>
  <meta name="description" content="Watch Leonardo Angellotti's featured video with full context and details." />
  <!-- Copy the same colour palette and basic layout styles from the portfolio homepage to ensure a consistent look and feel across pages -->
  <style>
    :root {
      --bg: #0b1020;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --muted: #b8c1d9;
      --accent: #7c3aed;
      --accent-2: #06b6d4;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      background:
        radial-gradient(circle at top left, rgba(214, 122, 74, 0.35), transparent 35%),
        radial-gradient(circle at top right, rgba(240, 179, 122, 0.22), transparent 30%),
        #1b0f0a;

      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(18px);
      background: rgba(11, 16, 32, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
    }

    .logo {
      font-weight: 800;
      letter-spacing: -0.04em;
      font-size: 1.15rem;
    }

    .nav-links {
      display: flex;
      gap: 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .nav-links a:hover {
      color: var(--text);
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 42px;
      align-items: center;
      padding: 92px 0 70px;

      border: 1px solid rgba(255,255,255,0.12);

      background:
        linear-gradient(
          135deg,
          #6b2d1a 0%,
          #a24d2a 35%,
          #d67a4a 70%,
          #f0b37a 100%
        );

      border-radius: 34px;
    }

    h1 {
      font-size: clamp(2.6rem, 7vw, 5rem);
      line-height: 0.95;
      letter-spacing: -0.08em;
      margin-bottom: 24px;
    }

    .gradient-text {
      background: linear-gradient(
        135deg,
        #fff4e6,
        #ffcc99 45%,
        #ff9966
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      font-size: 1.15rem;
      color: var(--muted);
      max-width: 680px;
      margin-bottom: 30px;
    }

    .hero-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: -12px 0 28px;
    }

    .hero-contact a {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 9px 12px;
      color: var(--text);
      font-weight: 700;
      font-size: 0.94rem;
    }

    .feature-preview {
      width: 100%;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 18px 54px rgba(0,0,0,0.24);
      flex: 0 0 auto;
    }

    iframe {
      width: 100%;
      height: 360px;
      border: none;
    }

    footer {
      color: var(--muted);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 24px 0 36px;
      text-align: center;
      font-size: 0.95rem;
    }

    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <!-- Link back to the homepage -->
        <!-- Logo links to the contact section on the homepage (use index.html as the root file) -->
        <a class="logo" href="index.html#contact">Leonardo Angellotti</a>
        <div class="nav-links">
          <a href="index.html#projects">Projects</a>
          <a href="index.html#skills">Skills</a>
          <a href="video.html">Video</a>
          <a href="viaggi/index.html">Travel</a>
          <a href="index.html#contact">Contact</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
      <div>
        <h1><span class="gradient-text">Love Passing By</span></h1>
        <p>I've written and directed my first short film!</p>
        <!-- Contact information at the top of the page -->
        <div class="hero-contact" id="contact" aria-label="Contact links">
          <a href="mailto:angellottileonardo@gmail.com">angellottileonardo@gmail.com</a>
          <a href="tel:+393806963693">+39 380 696 3693</a>
        </div>
      </div>
      <aside class="feature-preview">
        <!-- Embedded YouTube video -->
        <iframe src="https://www.youtube.com/embed/0v86goGeAUI" title="Love Passing By" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </aside>
  </main>

  <footer>
    <div class="container">
      © 2026 Leonardo Angellotti — Portfolio published with GitHub Pages.
    </div>
  </footer>
</body>
</html>
